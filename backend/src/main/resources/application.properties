server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/habitforge}
spring.datasource.username=${DATABASE_USERNAME:habitforge}
spring.datasource.password=${DATABASE_PASSWORD:habitforge}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
habitforge.jwt.secret=${JWT_SECRET}
habitforge.jwt.expiration-minutes=60
habitforge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.path=/swagger-ui.html
